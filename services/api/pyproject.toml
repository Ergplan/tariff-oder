[project]
name = "tariff-api"
version = "0.1.0"
description = "Tariff Order Intelligence - FastAPI data service, migrations owner, platform adapters"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "python-multipart>=0.0.20,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy>=2.0.36,<3",
    "alembic>=1.14,<2",
    "psycopg[binary,pool]>=3.2,<4",
    "pymupdf>=1.25,<2",
    "pypdf>=5.1,<7",
    "google-cloud-storage>=2.19,<4",
    "google-cloud-secret-manager>=2.22,<3",
    "google-auth>=2.37,<3",
    "requests>=2.32,<3",
]

[project.scripts]
tariff-api = "tariff_api.cli:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tariff_api"]
