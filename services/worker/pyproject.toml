[project]
name = "tariff-worker"
version = "0.1.0"
description = "Tariff Order Intelligence - durable job runner and reading-pipeline stages"
requires-python = ">=3.11,<3.13"
dependencies = [
    "tariff-api",
]

[project.scripts]
tariff-worker = "tariff_worker.main:main"

[tool.uv.sources]
tariff-api = { workspace = true }

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tariff_worker"]
