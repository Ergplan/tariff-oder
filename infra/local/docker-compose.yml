# Local profile (developer machines and CI).  `make dev` starts this stack.
# Behaviour is identical to the gcp profile except for the adapters named in the env below.
name: tariff

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: tariff
      POSTGRES_PASSWORD: tariff
      POSTGRES_DB: tariff
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tariff -d tariff"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    # Optional S3-compatible store for developers who want bucket semantics locally.
    # The default local adapter is the filesystem store; see ADR-0004.
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    profiles: ["minio"]

  migrate:
    build:
      context: ../..
      dockerfile: infra/local/Dockerfile.python
    command: ["tariff-api", "migrate"]
    environment: &api_env
      DEPLOYMENT_PROFILE: local
      ENVIRONMENT_NAME: local
      DATABASE_URL: postgresql+psycopg://tariff:tariff@postgres:5432/tariff
      OBJECT_STORE_BACKEND: filesystem
      OBJECT_STORE_ROOT: /data/object-store
      SECRETS_BACKEND: env
      IDENTITY_BACKEND: local
      LOCAL_USER_ALLOWLIST: ${LOCAL_USER_ALLOWLIST:-admin@example.com:administrator,reviewer@example.com:reviewer,analyst@example.com:analyst}
      GOLDEN_MANIFEST_PATH: /app/tests/golden/manifest.json
      LOG_FORMAT: json
    volumes:
      - objectstore:/data/object-store
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ../..
      dockerfile: infra/local/Dockerfile.python
    command: ["uvicorn", "tariff_api.asgi:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: *api_env
    ports:
      - "8000:8000"
    volumes:
      - objectstore:/data/object-store
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/readyz').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ../..
      dockerfile: infra/local/Dockerfile.python
    command: ["tariff-worker", "--poll-seconds", "1"]
    environment: *api_env
    volumes:
      - objectstore:/data/object-store
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ../..
      dockerfile: infra/local/Dockerfile.web
    environment:
      DEPLOYMENT_PROFILE: local
      API_BASE_URL: http://api:8000
      LOCAL_WEB_USER: ${LOCAL_WEB_USER:-admin@example.com}
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
  objectstore:
