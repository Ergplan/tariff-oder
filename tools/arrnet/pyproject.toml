[project]
name = "arrnet"
version = "0.1.0"
description = "ARR Network agents: courier, readers, verifier, librarian, auditor and director"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pymupdf>=1.24,<2",
    "httpx>=0.27,<1",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
docling = ["docling>=2.50,<3"]
embed = ["fastembed>=0.4,<1"]
llama = []  # LlamaParse is plain HTTPS: httpx (a core dependency) is enough
llm = ["anthropic>=0.40"]
dev = ["pytest>=8.3,<9", "pytest-timeout>=2.3,<3", "ruff>=0.9,<1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["arrnet", "arrnet.readers"]

[tool.setuptools.package-data]
arrnet = ["reference.json", "policy.yaml"]
